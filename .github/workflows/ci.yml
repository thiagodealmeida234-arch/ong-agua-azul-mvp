name: CI - Verificação e Testes Automatizados

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar Django e dependências
      run: |
        python -m pip install --upgrade pip
        pip install "Django>=5.0,<5.2" whitenoise gunicorn

    - name: Validar sintaxe e estrutura do código Python
      run: |
        python -m compileall .
        python -c "import django; print('Django:', django.get_version())"
