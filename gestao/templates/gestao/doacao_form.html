{% extends 'gestao/base.html' %}
{% block title %}Registrar Doação — ONG Água Azul{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 fw-bold m-0">Registrar Doação</h1>
    <a href="{% url 'inicio' %}" class="btn btn-outline-secondary btn-toque px-3">Voltar</a>
</div>

<div class="card card-ong p-4 bg-white shadow-sm">
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger fw-semibold mt-1">⚠️ {{ field.errors|striptags }}</div>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-success btn-toque w-100 mt-2">Salvar Doação</button>
    </form>
</div>
{% endblock %}
