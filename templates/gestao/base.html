<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ONG Água Azul{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f9; color: #1e293b; font-size: 16px; }
        .navbar-ong { background-color: #0b5394; }
        .btn-toque { min-height: 48px; font-size: 1.05rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .form-control-lg, .form-select-lg { min-height: 48px; font-size: 16px; border: 2px solid #94a3b8; }
        .form-label { font-weight: 700; color: #0f172a; margin-bottom: 4px; }
        .card-ong { border: 1px solid #cbd5e1; border-radius: 12px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark navbar-ong py-3 shadow-sm">
        <div class="container" style="max-width: 600px;">
            <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">💧 ONG Água Azul</a>
            {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm px-3" style="min-height: 44px;">Sair</button>
            </form>
            {% endif %}
        </div>
    </nav>

    <main class="container py-4" style="max-width: 600px;">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} border-2 fw-semibold" role="alert">
            {% if message.tags == 'success' %}✅{% elif message.tags == 'warning' or message.tags == 'danger' %}⚠️{% else %}ℹ️{% endif %}
            {{ message }}
        </div>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
