{% extends 'gestao/base.html' %}
{% block title %}Entrar — ONG Água Azul{% endblock %}
{% block content %}
<div class="card card-ong shadow-sm p-4 bg-white">
    <h1 class="h4 fw-bold mb-1">Acesso ao Sistema</h1>
    <p class="text-secondary mb-4">Controle de campanhas e doações comunitárias</p>

    {% if form.errors %}
    <div class="alert alert-danger fw-semibold" role="alert">
        ⚠️ Usuário ou senha inválidos. Tente novamente.
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_username" class="form-label">Usuário</label>
            <input type="text" name="username" id="id_username" class="form-control form-control-lg" required autofocus>
        </div>
        <div class="mb-4">
            <label for="id_password" class="form-label">Senha</label>
            <input type="password" name="password" id="id_password" class="form-control form-control-lg" required>
        </div>
        <button type="submit" class="btn btn-primary btn-toque w-100">Entrar</button>
    </form>
</div>
{% endblock %}
